services:
  - type: web
    name: ididididii
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: mitid_admin_secret_key_2026
      - key: ADMIN_EMAIL
        value: admin@mitid.com
      - key: ADMIN_PASSWORD
        value: admin123
